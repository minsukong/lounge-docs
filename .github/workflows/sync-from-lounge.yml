name: Sync entire repository from lounge-docs

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-lounge
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'THLV3FOFE/THL_V3_FO_FE' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Synchronize main with the public source repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_url='https://github.com/minsukong/lounge-docs.git'
          target_url='https://github.com/THLV3FOFE/THL_V3_FO_FE.git'
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth_header}"
          git init --bare sync.git
          cd sync.git
          git fetch --no-tags "$source_url" '+refs/heads/main:refs/heads/source-main'
          git -c "http.extraheader=$auth_header" fetch --no-tags "$target_url" '+refs/heads/main:refs/heads/target-main'
          source_sha=$(git rev-parse refs/heads/source-main)
          target_sha=$(git rev-parse refs/heads/target-main)
          # Use source files while preserving the target's own .github directory.
          git read-tree "$source_sha"
          git ls-tree -r --name-only -z "$source_sha" -- .github/ | git update-index --force-remove -z --stdin
          git read-tree --prefix=.github/ "$target_sha:.github"
          sync_tree=$(git write-tree)
          if [ "$sync_tree" = "$(git rev-parse "$target_sha^{tree}")" ]; then
            echo 'Already synchronized.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          sync_commit=$(printf 'Sync files from lounge-docs (%s)\n' "${source_sha:0:12}" | git commit-tree "$sync_tree" -p "$target_sha")
          git -c "http.extraheader=$auth_header" push "$target_url" "$sync_commit:refs/heads/main"
          printf 'Synchronized files from `%s`; source `.github/` excluded.\n' "$source_sha" >> "$GITHUB_STEP_SUMMARY"
